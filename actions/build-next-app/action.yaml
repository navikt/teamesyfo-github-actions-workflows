name: "Build Next.js app and push to Docker"
description: "Builds a Next.js App with pnpm, creates a docker image and uploads it to GAR"

inputs:
  app:
    description: "Application name"
    required: true
  env:
    description: "Environment name"
    required: true
  NPM_AUTH_TOKEN:
    description: "NPM authentication token"
    required: true
  node-version:
    description: "Node version"
    required: true
  enable-next-deployment-id:
    description: "Enable Next.js deploymentId/version skew protection. Set to false if it breaks BUILD_ID/static assets."
    required: false
    default: true
  server-actions-encryption-key:
    description: "Encryption key for Next.js Server Actions, should be a 32-byte base64 string"
    required: false

outputs:
  image:
    description: "Docker image in GAR"
    value: ${{ steps.docker-build-push.outputs.image }}

runs:
  using: "composite"
  steps:
    - uses: navikt/teamesyfo-github-actions-workflows/actions/setup-pnpm@main
      with:
        NPM_AUTH_TOKEN: ${{ inputs.NPM_AUTH_TOKEN }}
        node-version: ${{ inputs.node-version }}
    - name: Cache Next.js build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          ${{ github.workspace }}/.next/cache
        key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.json', 'next.config.*') }}
        restore-keys: |
          ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
    - name: Copy appropriate env file to root
      shell: bash
      run: |
        echo "Copying nais/envs/.env.${{ inputs.env }}..."
        cp nais/envs/.env.${{ inputs.env }} .env.production
    - name: Build application
      shell: bash
      run: |
        if [ "${{ inputs.enable-next-deployment-id }}" = "true" ]; then
          export NEXT_DEPLOYMENT_ID="${{ github.sha }}"
        else
          unset NEXT_DEPLOYMENT_ID
        fi
        
        if [ -n "${{ inputs.server-actions-encryption-key }}" ]; then
          export NEXT_SERVER_ACTIONS_ENCRYPTION_KEY="${{ inputs.server-actions-encryption-key }}"
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is set, opting in with custom key."
        else
          echo "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set, building with default behavior."
          unset NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        fi
        
        pnpm run build
      env:
        NEXT_PUBLIC_VERSION: ${{ github.sha }}
        NEXT_DEPLOYMENT_ID: ${{ github.sha }}
    - name: Upload static files to NAV CDN
      uses: nais/deploy/actions/cdn-upload/v2@fa754451577294aae42872a69b888b3470478ec1 # v2 (master)
      if: ${{ github.actor != 'dependabot[bot]' }}
      with:
        team: team-esyfo
        source: ./.next/static
        destination: "/${{ inputs.app }}/_next"
    - name: Push docker image to GAR
      uses: nais/docker-build-push@v0
      if: ${{ github.actor != 'dependabot[bot]' }}
      id: docker-build-push
      with:
        team: team-esyfo
        image_suffix: ${{ inputs.env }}
