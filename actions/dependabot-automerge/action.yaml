name: "Dependabot automerge"
description: >-
  Approves and merges Dependabot pull requests that follow the team policy.
  Never checks out or runs code from a pull request.
  See docs/dependabot-automerge.md.

inputs:
  app-private-key:
    description: "Private key for the teamesyfo-automerge GitHub App. Only the merge step uses it."
    required: true
  copilot-review:
    description: "Request a comment-only Copilot review on updates that need a manual review."
    required: false
    default: "true"

outputs:
  approved:
    description: "JSON list of the pull requests and head commits that this run approved."
    value: ${{ steps.evaluate.outputs.approved }}

runs:
  using: "composite"
  steps:
    # The App key comes from the dependabot-automerge environment. Stop before
    # approving anything when the environment lacks it.
    - name: Check the App key
      if: inputs.app-private-key == ''
      shell: bash
      run: |
        echo "::error::The secret AUTOMERGE_APP_PRIVATE_KEY is empty. Add it to the dependabot-automerge environment."
        exit 1

    # Uses the job's GITHUB_TOKEN, so the approval comes from github-actions[bot].
    - name: Evaluate and approve Dependabot pull requests
      id: evaluate
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        COPILOT_REVIEW: ${{ inputs.copilot-review }}
      with:
        script: |
          const automerge = require(`${process.env.ACTION_PATH}/automerge.js`)
          await automerge.evaluateAndApprove({
            github,
            context,
            core,
            copilotReview: process.env.COPILOT_REVIEW === 'true',
          })

    # An App token is needed because GITHUB_TOKEN can neither add pull requests
    # to a merge queue nor trigger the workflows that run after a merge.
    - name: Create GitHub App token
      id: app-token
      if: steps.evaluate.outputs.approved != '[]'
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        client-id: Iv23liqxZsjVqOVzo0se # teamesyfo-automerge (App ID 2906300)
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Merge approved pull requests
      if: steps.evaluate.outputs.approved != '[]'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        APPROVED: ${{ steps.evaluate.outputs.approved }}
      with:
        github-token: ${{ steps.app-token.outputs.token }}
        script: |
          const automerge = require(`${process.env.ACTION_PATH}/automerge.js`)
          await automerge.merge({ github, context, core, approved: JSON.parse(process.env.APPROVED) })
