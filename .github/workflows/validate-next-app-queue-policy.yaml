name: Validate Next.js merge queue policy

on:
  pull_request:
    paths:
      - ".github/workflows/next-app-v2.yaml"
      - ".github/workflows/validate-next-app-queue-policy.yaml"
      - "actions/build-next-app/action.yaml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/next-app-v2.yaml"
      - ".github/workflows/validate-next-app-queue-policy.yaml"
      - "actions/build-next-app/action.yaml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate queue policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Evaluate artifact publication policy
        env:
          MERGE_GROUP: ${{ 'merge_group' != 'merge_group' && !startsWith('refs/heads/feature', 'refs/heads/gh-readonly-queue/') }}
          QUEUE_PUSH: ${{ 'push' != 'merge_group' && !startsWith('refs/heads/gh-readonly-queue/main/pr-1000-0000000000000000000000000000000000000000', 'refs/heads/gh-readonly-queue/') }}
          NORMAL_PUSH: ${{ 'push' != 'merge_group' && !startsWith('refs/heads/main', 'refs/heads/gh-readonly-queue/') }}
        run: |
          set -euo pipefail
          test "$MERGE_GROUP" = false
          test "$QUEUE_PUSH" = false
          test "$NORMAL_PUSH" = true

      - name: Verify production wiring
        run: |
          set -euo pipefail

          queue_policy="github.event_name != 'merge_group' && !startsWith(github.ref, 'refs/heads/gh-readonly-queue/')"
          test "$(grep -F -c "$queue_policy" .github/workflows/next-app-v2.yaml)" -eq 2
          test "$(grep -F -c "$queue_policy" actions/build-next-app/action.yaml)" -eq 2
          test "$(grep -F -c "inputs.publish-artifacts == 'true'" actions/build-next-app/action.yaml)" -eq 2
