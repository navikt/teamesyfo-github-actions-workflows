name: Test actions

# Runs without secrets and with a read-only token, also for Dependabot PRs.
# Make "Unit tests" a required status check on main:
# dependabot-automerge-v2.yaml merges nothing without a required check.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions: {}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test dependabot-automerge
        run: node --test actions/dependabot-automerge/automerge.test.js
