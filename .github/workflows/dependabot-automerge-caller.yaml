name: Dependabot automerge (this repo)

on:
  schedule:
    # Every 30 minutes on weekdays, 07:00–15:30 in Oslo. The workflow itself
    # pauses on 1 May, 17 May and 24 December–1 January.
    - cron: "*/30 7-15 * * 1-5"
      timezone: "Europe/Oslo"
  workflow_dispatch:

permissions: {}

jobs:
  automerge:
    # Off until an admin has set up the protected environment and its secret,
    # and has deleted the repository secret with the App key. Otherwise GitHub
    # creates the environment without protection and uses that secret. Turn
    # it on with the repository variable DEPENDABOT_AUTOMERGE_ENABLED=true.
    if: vars.DEPENDABOT_AUTOMERGE_ENABLED == 'true'
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
      statuses: read
    # Self-repository reference: pinning this repo's own SHA would make
    # Dependabot open a new bump PR after every merge.
    uses: $/.github/workflows/dependabot-automerge-v2.yaml
    secrets:
      AUTOMERGE_APP_PRIVATE_KEY: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
