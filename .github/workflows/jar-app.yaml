on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: "19"
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: kotlin
          tools: linked
      - uses: navikt/teamesyfo-github-actions-workflows/actions/gradle-cached@main
        with:
          java-version: ${{inputs.java-version}}
      - name: Build shadowJar
        shell: bash
        run: ./gradlew clean shadowJar -x test --no-daemon --no-build-cache
        env:
          JAVA_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=1g"
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:kotlin"

  test:
    name: Check lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: navikt/teamesyfo-github-actions-workflows/actions/gradle-cached@main
        with:
          java-version: ${{inputs.java-version}}
      - name: Run Gradle check (lint and test)
        run: ./gradlew check
        env:
          ORG_GRADLE_PROJECT_githubUser: x-access-token
          ORG_GRADLE_PROJECT_githubPassword: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      id-token: write
    outputs:
      image: ${{ steps.build-and-publish.outputs.image }}
    steps:
      - uses: navikt/teamesyfo-github-actions-workflows/actions/jar-to-docker@main
        id: build-and-publish
        with:
          app: ${{ inputs.app }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          java-version: ${{ inputs.java-version }}

  merge-gate:
    name: Merge gate
    needs: [analyze, test, build]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # Single required check for branch protection.
          results=(
            "analyze=${{ needs.analyze.result }}"
            "test=${{ needs.test.result }}"
            "build=${{ needs.build.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success) ;;
              cancelled)
                echo "::error::Required job was cancelled: $r"
                exit 1
                ;;
              *)
                echo "::error::Required job failed: $r"
                exit 1
                ;;
            esac
          done

  deploy-dev:
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.draft == false }}
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/nais-dev.yaml
          VAR: image=${{ needs.build.outputs.image }}

  deploy-prod:
    if: github.ref_name == 'main'
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nais/deploy/actions/deploy@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais/nais-prod.yaml
          VAR: image=${{ needs.build.outputs.image }}
